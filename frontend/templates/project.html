<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プロジェクト詳細 - AI Design Automation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center gap-4">
  <a href="/" class="text-gray-400 hover:text-gray-600 text-sm">← 一覧に戻る</a>
  <h1 id="project-name" class="text-lg font-bold text-gray-800"></h1>
  <span id="phase-badge" class="phase-badge"></span>
</header>

<main class="max-w-7xl mx-auto px-6 py-6">

  <!-- Phase Stepper -->
  <div id="stepper" class="flex items-center gap-2 mb-6 overflow-x-auto pb-2"></div>

  <!-- ═══ Sub-phase panel (planning phase only) ═══ -->
  <div id="sub-phase-panel" class="hidden">
    <div class="flex bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden" style="min-height:720px">

      <!-- Sidebar -->
      <div id="sub-sidebar" class="w-56 border-r border-gray-200 overflow-y-auto flex-shrink-0 bg-gray-50 py-2"></div>

      <!-- Main content area -->
      <div class="flex-1 flex flex-col min-w-0">

        <!-- Sub-phase header -->
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100 bg-white flex-shrink-0">
          <span id="sub-phase-title" class="text-sm font-semibold text-gray-700"></span>
          <span id="sub-status-label" class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500"></span>
        </div>

        <!-- Run area -->
        <div id="sub-run-area" class="flex items-center gap-3 px-5 py-3 border-b border-gray-100 bg-gray-50 flex-shrink-0">
          <button id="btn-sub-run" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
            エージェントを実行
          </button>
          <div id="sub-spinner" class="hidden spinner"></div>
          <span id="sub-run-status" class="text-sm text-gray-500"></span>
        </div>

        <!-- Empty state -->
        <div id="sub-empty-state" class="hidden flex-1 flex items-center justify-center py-20 text-gray-400 text-sm">
          この手順はまだ実行されていません
        </div>

        <!-- iframe output -->
        <iframe id="sub-iframe" class="w-full hidden flex-shrink-0" style="height:520px; border:none;"></iframe>

        <!-- Truncation warning banner -->
        <div id="sub-truncation-banner" class="hidden px-5 py-4 border-t border-orange-200 bg-orange-50 flex-shrink-0">
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-orange-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            <div class="flex-1">
              <p class="text-sm font-semibold text-orange-700 mb-1">出力がトークン上限に達しました</p>
              <p class="text-xs text-orange-600 mb-3">コンテンツが途中で切れている可能性があります。このまま確認に進むか、HTMLを整えて確認してください。</p>
              <div class="flex flex-wrap gap-2">
                <!-- Option 1: Accept as-is -->
                <button id="btn-truncation-proceed"
                  class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                  </svg>
                  このまま確認に進む
                  <span class="text-xs opacity-75">（現在の出力を完成版とする）</span>
                </button>
                <!-- Option 2: Continue from truncation point -->
                <button id="btn-truncation-continue"
                  class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                  </svg>
                  HTMLを整えて確認に進む
                  <span class="text-xs opacity-75">（切れた箇所でタグを閉じる・新規生成なし）</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Review panel -->
        <div id="sub-review-panel" class="hidden px-5 py-4 border-t border-gray-200 bg-white flex-shrink-0">
          <div class="flex flex-wrap gap-3 mb-3">
            <button id="btn-sub-approve" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
              承認して次へ進む
            </button>
            <button id="btn-sub-reject-toggle" class="border border-red-400 text-red-500 hover:bg-red-50 px-5 py-2 rounded-lg text-sm font-medium transition">
              差し戻し
            </button>
            <button id="btn-sub-edit-toggle" class="border border-gray-300 text-gray-600 hover:bg-gray-50 px-5 py-2 rounded-lg text-sm font-medium transition">
              一部修正
            </button>
          </div>
          <!-- Reject form -->
          <div id="sub-reject-form" class="hidden mt-2">
            <textarea id="sub-reject-comment" rows="3"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-red-400 resize-none"
              placeholder="差し戻しの理由を記載してください"></textarea>
            <div class="flex gap-2 mt-2">
              <button id="btn-sub-reject-submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">差し戻しを送信</button>
              <button id="btn-sub-reject-cancel" class="text-gray-500 text-sm px-3 py-2">キャンセル</button>
            </div>
          </div>
          <!-- Edit form -->
          <div id="sub-edit-form" class="hidden mt-2">
            <textarea id="sub-edit-instruction" rows="3"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 resize-none"
              placeholder="修正してほしい内容を具体的に記載してください"></textarea>
            <div class="flex gap-2 mt-2">
              <button id="btn-sub-edit-submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">修正を依頼してエージェント再実行</button>
              <button id="btn-sub-edit-cancel" class="text-gray-500 text-sm px-3 py-2">キャンセル</button>
            </div>
          </div>
        </div>

        <!-- Deep-dive panel (why_market only) -->
        <div id="deep-dive-panel" class="hidden px-5 py-4 border-t border-blue-100 bg-blue-50 flex-shrink-0">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-sm font-semibold text-blue-700">追加調査</span>
            <span class="text-xs text-blue-500">競合・市場について深掘り調査を実行します</span>
          </div>
          <div class="flex gap-3 items-start">
            <textarea id="deep-dive-input" rows="2"
              class="flex-1 border border-blue-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 resize-none"
              placeholder="例：〇〇企業の競合優位性について深掘りして"></textarea>
            <div class="flex flex-col items-center gap-1">
              <button id="btn-deep-dive" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap">
                追加調査を実行
              </button>
              <div id="deep-dive-spinner" class="hidden spinner"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══ Regular phase panel (factcheck / proposal_outline / mockup) ═══ -->
  <div id="phase-panel">

    <!-- Run Button Area -->
    <div id="run-area" class="mb-4 flex items-center gap-3">
      <button id="btn-run" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition">
        <span id="run-label">エージェントを実行</span>
      </button>
      <div id="run-spinner" class="hidden spinner"></div>
      <span id="run-status" class="text-sm text-gray-500"></span>
    </div>

    <!-- Output Viewer -->
    <div id="output-area" class="hidden">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100 bg-gray-50">
          <span id="output-phase-label" class="text-sm font-semibold text-gray-700"></span>
          <span id="output-status-label" class="text-xs text-gray-400"></span>
        </div>
        <iframe id="output-iframe" class="output-iframe" style="height:600px;"></iframe>
      </div>

      <!-- Review Panel -->
      <div id="review-panel" class="mt-4 bg-white rounded-xl border border-gray-200 shadow-sm p-5">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">レビュー</h3>
        <div class="flex flex-wrap gap-3 mb-4">
          <button id="btn-approve" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
            承認して次へ進む
          </button>
          <button id="btn-reject-toggle" class="border border-red-400 text-red-500 hover:bg-red-50 px-5 py-2 rounded-lg text-sm font-medium transition">
            差し戻し
          </button>
          <button id="btn-edit-toggle" class="border border-gray-300 text-gray-600 hover:bg-gray-50 px-5 py-2 rounded-lg text-sm font-medium transition">
            一部修正
          </button>
        </div>
        <!-- Reject form -->
        <div id="reject-form" class="hidden mt-3">
          <textarea id="reject-comment" rows="3"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-red-400 resize-none"
            placeholder="差し戻しの理由・修正してほしい内容を記載してください"></textarea>
          <div class="flex gap-2 mt-2">
            <button id="btn-reject-submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">差し戻しを送信</button>
            <button id="btn-reject-cancel" class="text-gray-500 text-sm px-3 py-2">キャンセル</button>
          </div>
        </div>
        <!-- Edit form -->
        <div id="edit-form" class="hidden mt-3">
          <textarea id="edit-instruction" rows="3"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 resize-none"
            placeholder="修正してほしい内容を具体的に記載してください"></textarea>
          <div class="flex gap-2 mt-2">
            <button id="btn-edit-submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">修正を依頼してエージェント再実行</button>
            <button id="btn-edit-cancel" class="text-gray-500 text-sm px-3 py-2">キャンセル</button>
          </div>
        </div>
      </div>
    </div>

  </div>

</main>

<script src="/static/js/project.js"></script>
</body>
</html>
